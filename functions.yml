  producer:
    handler: ./src/producer.handler
    events:
      - httpApi:
          path: /producer
          method: post
  consumer:
    handler: ./src/consumer.handler
    events:
      - sqs:
          arn: arn:aws:sqs:${aws:region}:${env:AWS_ACCOUNT_ID}:${env:QUEUE_NAME}
  consumer2:
    handler: ./src/consumer2.handler
    events:
      - sqs:
          arn: arn:aws:sqs:${aws:region}:${env:AWS_ACCOUNT_ID}:${env:QUEUE_2_NAME}