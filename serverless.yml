service: sls-sns-ts-example
frameworkVersion: "3"
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  httpApi:
    cors: true
  logs:
    lambda: true
  environment:
    TOPIC_ARN: ${self:custom.topicArn}
    QUEUE_URL: ${self:custom.queueUrl}
    AWS_ACCOUNT_ID: ${env:AWS_ACCOUNT_ID}
    AWS_ACCESS_KEY_ID: ${env:AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${env:AWS_SECRET_ACCESS_KEY}
    AWS_SESSION_TOKEN: ${env:AWS_SESSION_TOKEN}
    AWS_REGION: ${aws:region}

functions:
  ${file(./functions.yml)}

custom:
  esbuild:
    minify: false
    sourcemap: linked
    watch:
      pattern: "src/**/*.ts"
      ignore: "node_modules/**/*"
  serverless-offline-sns:
    host: 0.0.0.0 # Enable plugin to listen on every local address
    sns-subscribe-endpoint: ${env:LOCAL_HOST_IP} #Host ip address
    sns-endpoint: ${env:SNS_ENDPOINT} # Default localstack sns endpoint
    debug: true
  topicArn: arn:aws:sns:${aws:region}:${env:AWS_ACCOUNT_ID}:${env:TOPIC_NAME}
  serverless-offline-sqs:
    autoCreate: true
    apiVersion: '2024-01-10'
    endpoint: ${env:QUEUE_HOST_URL}
    region: ${self:provider.region}
    accessKeyId: ${env:AWS_ACCESS_KEY_ID}
    secretAccessKey: ${env:AWS_SECRET_ACCESS_KEY}
    skipCacheInvalidation: false
  queueUrl: ${env:QUEUE_HOST_URL}/${env:AWS_ACCOUNT_ID}/${env:QUEUE_NAME}

plugins:
  - serverless-dotenv-plugin
  - serverless-esbuild
  - serverless-offline-sqs
  - serverless-offline
  - serverless-offline-sns
