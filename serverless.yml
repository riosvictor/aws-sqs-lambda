service: sls-sqs-ts-example
frameworkVersion: "3"
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  httpApi:
    cors: true
  environment:
    SNS_TOPIC_ARN: ${self:custom.topicArn}
    QUEUE_LOG_URL: ${self:custom.queueLogUrl}
    QUEUE_RESILIENT_URL: ${self:custom.queueResilientUrl}
    FINAL_ERROR_QUEUE_URL: ${self:custom.queueResilientFinalDlqUrl}
    IDEMPOTENCY_TABLE_NAME: ${self:custom.idempotencyTableName}
    AWS_ACCOUNT_ID: ${env:AWS_ACCOUNT_ID}
    AWS_ACCESS_KEY_ID: ${env:AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${env:AWS_SECRET_ACCESS_KEY}
    AWS_SESSION_TOKEN: ${env:AWS_SESSION_TOKEN}
    AWS_REGION: ${aws:region}
    QUEUE_HOST_URL: ${env:QUEUE_HOST_URL}
    SNS_ENDPOINT_URL: ${env:QUEUE_HOST_URL}
    DYNAMODB_ENDPOINT_URL: ${env:QUEUE_HOST_URL}

functions:
  producer:
    handler: ./src/producer.handler
    events:
      - httpApi:
          path: /producer
          method: post
  consumerLog:
    handler: ./src/consumer-log.handler
    events:
      - sqs:
          arn: arn:aws:sqs:${aws:region}:${env:AWS_ACCOUNT_ID}:${env:QUEUE_LOG_NAME}
          batchSize: 10
          maximumBatchingWindow: 5
          functionResponseType: ReportBatchItemFailures
  consumerResilient:
    handler: ./src/consumer-resilient.handler
    events:
      - sqs:
          arn: arn:aws:sqs:${aws:region}:${env:AWS_ACCOUNT_ID}:${env:QUEUE_RESILIENT_NAME}
          batchSize: 1
          maximumBatchingWindow: 5
          functionResponseType: ReportBatchItemFailures

custom:
  esbuild:
    minify: false
    sourcemap: linked
    watch:
      pattern: "src/**/*.ts"
      ignore: "node_modules/**/*"
  serverless-offline-sqs:
    autoCreate: false
    apiVersion: '2024-01-10'
    endpoint: ${env:QUEUE_HOST_URL}
    region: ${self:provider.region}
    accessKeyId: ${env:AWS_ACCESS_KEY_ID}
    secretAccessKey: ${env:AWS_SECRET_ACCESS_KEY}
    skipCacheInvalidation: false
  topicArn: arn:aws:sns:${aws:region}:${env:AWS_ACCOUNT_ID}:${env:SNS_TOPIC_NAME}
  queueLogUrl: ${env:QUEUE_HOST_URL}/${env:AWS_ACCOUNT_ID}/${env:QUEUE_LOG_NAME}
  queueResilientUrl: ${env:QUEUE_HOST_URL}/${env:AWS_ACCOUNT_ID}/${env:QUEUE_RESILIENT_NAME}
  queueResilientFinalDlqUrl: ${env:QUEUE_HOST_URL}/${env:AWS_ACCOUNT_ID}/${env:QUEUE_RESILIENT_FINAL_DLQ_NAME}
  idempotencyTableName: ${env:IDEMPOTENCY_TABLE_NAME}

plugins:
  - serverless-dotenv-plugin
  - serverless-esbuild
  - serverless-offline-sqs
  - ./plugins/serverless-offline.cjs
